<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page not found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Kharcha is a single-page app. Keep the screen and its details (e.g. /kharcha/add?amount=40) for the
    // app's own page, which puts them back in the address bar before Kharcha starts.
    var p = location.pathname;
    if (p.indexOf('/kharcha/') === 0) {
      try { sessionStorage.setItem('kharcha-route', p + location.search + location.hash); } catch (e) {}
      location.replace('/kharcha/');
    }
  </script>
</head>
<body>
  <p>This page doesn't exist. <a href="/PortfolioWebsite/">Go to Shishir Garg's portfolio</a>.</p>
</body>
</html>
